# Daylog 前端 Nginx 站点配置
# 职责：托管 Vue 静态资源 + 反向代理后端 API / 图片
# 容器间通过 docker-compose 服务名 backend 通信（见 docker-compose.yml）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 上传上限与后端 multipart 配置保持一致
    client_max_body_size 20m;

    # ---- 1. 后端 API：/api/xxx 去掉前缀后转发给后端服务 ----
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 周报生成可能较慢
    }

    # ---- 2. 上传图片等静态资源：回源到后端磁盘目录 ----
    # 后端将 /files/** 映射到本地 uploads 目录（WebMvcConfig）
    location /files/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 3. 前端资源（history 路由 SPA 回退）----
    location / {
        try_files $uri $uri/ /index.html;
        # 带 hash 的静态资源可长缓存（Vite 产物文件名含内容 hash）
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}

# ============================================================
# Daylog 一键部署编排
# 服务：mysql + redis + backend(Spring Boot) + nginx(前端)
#
# 使用：
#   1. cp .env.example .env   # 按需修改数据库密码 / JWT 密钥 / DeepSeek Key
#   2. docker compose up -d --build
#   3. 浏览器访问 http://localhost（NGINX_PORT）
#
# 宿主机端口均已避开本地开发默认端口（3306/6379/8080），
# 与本机 IDEA + localhost 联调环境互不冲突，可同时运行。
#
# mysql / redis / backend 的映射一律只绑 127.0.0.1：对公网开放的只有 nginx，
# 数据库和 Redis 不存在任何对外入口。远程连库请走 SSH 隧道：
#   ssh -L 13306:127.0.0.1:13306 root@服务器IP
# ============================================================

name: daylog

services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: daylog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-daylog123456}
      MYSQL_DATABASE: daylog
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表（schema.sql 含 CREATE DATABASE + USE，幂等）
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"   # 只绑回环，公网不可达
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-daylog123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: daylog-redis
    # always：Docker Desktop / 服务器重启后自动拉起，免手动 start
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"   # 只绑回环，公网不可达
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Spring Boot 后端 ----------
  backend:
    build: ./backend
    image: daylog-backend:latest
    container_name: daylog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 容器网络内直接使用服务名，无需映射端口
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: daylog
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-daylog123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 生产密钥：无默认值。本仓库是公开的，写死默认密钥等于公开签名私钥——
      # 任何人都能用它伪造任意用户 token。不设 .env 时 compose 直接拒绝启动。
      DAYLOG_JWT_SECRET: ${DAYLOG_JWT_SECRET:?请在 .env 中设置 DAYLOG_JWT_SECRET（openssl rand -base64 64）}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"   # 只绑回环；对外一律走 nginx，不给绕过网关的入口
    # 限制内存便于演示 JVM -XX:MaxRAMPercentage 适配容器
    mem_limit: 1024m

  # ---------- Nginx 前端网关 ----------
  nginx:
    build: ./frontend
    image: daylog-frontend:latest
    container_name: daylog-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"   # 前端唯一入口；若 80 被占用改 .env NGINX_PORT=8088

volumes:
  mysql-data:
  redis-data:
  uploads:

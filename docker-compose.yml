# ============================================================
# Daylog 一键部署编排
# 服务：mysql + redis + backend(Spring Boot) + nginx(前端)
#
# 使用：
#   1. cp .env.example .env   # 按需修改数据库密码 / JWT 密钥 / DeepSeek Key
#   2. docker compose up -d --build
#   3. 浏览器访问 http://localhost（NGINX_PORT）
#
# 宿主机端口均已避开本地开发默认端口（3306/6379/8080），
# 与本机 IDEA + localhost 联调环境互不冲突，可同时运行。
# ============================================================

name: daylog

services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: daylog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-daylog123456}
      MYSQL_DATABASE: daylog
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表（schema.sql 含 CREATE DATABASE + USE，幂等）
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${MYSQL_PORT:-13306}:3306"   # 避开本机 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-daylog123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: daylog-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"   # 避开本机 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Spring Boot 后端 ----------
  backend:
    build: ./backend
    image: daylog-backend:latest
    container_name: daylog-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 容器网络内直接使用服务名，无需映射端口
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: daylog
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-daylog123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 生产密钥：务必在 .env 中覆盖默认值！
      DAYLOG_JWT_SECRET: ${DAYLOG_JWT_SECRET:-daylog-docker-default-secret-change-me-please-use-a-random-string-of-at-least-256-bits}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-18080}:8080"   # 暴露给宿主机，便于直连调试 API
    # 限制内存便于演示 JVM -XX:MaxRAMPercentage 适配容器
    mem_limit: 1024m

  # ---------- Nginx 前端网关 ----------
  nginx:
    build: ./frontend
    image: daylog-frontend:latest
    container_name: daylog-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_PORT:-80}:80"   # 前端唯一入口；若 80 被占用改 .env NGINX_PORT=8088

volumes:
  mysql-data:
  redis-data:
  uploads:

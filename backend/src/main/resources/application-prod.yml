# 生产（Docker Compose）环境配置
# 所有连接参数均由环境变量注入，容器编排见根目录 docker-compose.yml
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:daylog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:daylog123456}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不打印 SQL
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 生产环境关闭 Swagger 文档入口（仅开发联调时开启）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

daylog:
  jwt:
    # 无默认值：没注入就启动失败。本仓库是公开的，把默认密钥写进源码等于公开签名私钥——
    # 任何人都能拿它伪造任意用户的 token，而且运行期完全无感。
    # 部署链上 docker-compose.yml 已用 ${DAYLOG_JWT_SECRET:?...} 强制要求 .env 提供
    secret: ${DAYLOG_JWT_SECRET}
    # 7 天 = 10080 分钟
    expire-minutes: 10080
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      timeout-seconds: 60
  upload:
    # 容器内绝对路径，由 docker-compose 挂载命名卷持久化
    dir: ${UPLOAD_DIR:/app/uploads}
    allowed-extensions: jpg,jpeg,png,gif,webp
  # 登录/注册限流（按客户端 IP 计数，Redis 固定窗口）
  rate-limit:
    login-window-seconds: 60
    login-max-attempts: 10
    register-window-seconds: 3600
    register-max-attempts: 5

logging:
  level:
    com.daylog: info
